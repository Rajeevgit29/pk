name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
        env:
          GITHUB_ACTIONS: "true"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub's built-in "pages build and deployment" (from the branch) also publishes on every
      # push, and whichever finishes last is what visitors see. Wait so this real build lands last.
      # The permanent fix is Settings → Pages → Source: "GitHub Actions"; then this wait can go.
      - name: Wait for the branch build to finish first
        run: sleep 90
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
